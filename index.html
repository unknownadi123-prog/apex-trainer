<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Apex Edge Trainer</title>

<style>
:root {
  --bg:#040406;
  --card:#0a0a12;
  --primary:#00f0ff;
  --accent:#7000ff;
  --stop:#ff0055;
  --cum:#ffffff;
  --text:#e0e6ed;
  --glow:rgba(0,240,255,.15);
}

* {
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:'Segoe UI',Roboto,system-ui,sans-serif;
}

body {
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  overflow-x:hidden;
  overflow-y:auto;
  position:relative;
}

#fxCanvas {
  position:fixed;
  inset:0;
  width:100vw;
  height:100vh;
  pointer-events:none;
  z-index:99;
}

.app-layout {
  display:flex;
  flex-direction:row;
  gap:20px;
  width:100%;
  max-width:820px;
  align-items:stretch;
  justify-content:center;
  z-index:1;
  margin:auto;
}

@media(max-width:768px) {
  .app-layout {
    flex-direction:column;
    align-items:center;
  }

  .stroke-panel {
    width:100%!important;
    max-width:320px;
  }
}

.container {
  flex:1;
  min-width:320px;
  background:var(--card);
  border:1px solid #1a1a29;
  border-radius:24px;
  padding:28px;
  box-shadow:0 0 50px var(--glow);
  text-align:center;
  position:relative;
  z-index:1;
}

.stroke-panel {
  width:220px;
  background:var(--card);
  border:1px solid #1a1a29;
  border-radius:24px;
  padding:20px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:space-between;
  box-shadow:0 0 30px rgba(0,0,0,.5);
}

.stroke-title {
  font-size:.8rem;
  letter-spacing:2px;
  text-transform:uppercase;
  color:var(--primary);
  margin-bottom:10px;
  font-weight:700;
}

.stroke-canvas-container {
  position:relative;
  width:100%;
  height:320px;
  display:flex;
  justify-content:center;
}

h1 {
  color:var(--primary);
  font-size:1.3rem;
  letter-spacing:3px;
  text-transform:uppercase;
  margin-bottom:15px;
  text-shadow:0 0 12px rgba(0,240,255,.6);
}

.visualizer-wrapper {
  position:relative;
  width:200px;
  height:200px;
  margin:10px auto;
  display:flex;
  align-items:center;
  justify-content:center;
}

canvas.main-canvas {
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  z-index:1;
}

.timer-overlay {
  position:relative;
  z-index:2;
  font-size:2.2rem;
  font-weight:700;
  color:#fff;
  text-shadow:0 0 15px var(--primary);
  font-variant-numeric:tabular-nums;
}

.progress-bar-container {
  width:100%;
  height:6px;
  background:#121220;
  border-radius:3px;
  overflow:hidden;
  margin:15px 0 10px;
}

.progress-bar-fill {
  height:100%;
  width:0%;
  background:var(--primary);
  transition:width .2s linear,background-color .3s ease;
  box-shadow:0 0 10px var(--primary);
}

.status-box.pause .progress-bar-fill {
  background:var(--stop);
}

.status-box.release .progress-bar-fill {
  background:var(--cum);
}

.intensity-container {
  width:100%;
  margin:15px 0;
  background:#06060c;
  border:1px solid #1a1a29;
  border-radius:12px;
  padding:12px 16px;
}

.intensity-header {
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-size:.75rem;
  letter-spacing:1px;
  text-transform:uppercase;
  color:#8a8a9e;
  margin-bottom:8px;
  font-weight:600;
}

.intensity-header span:last-child {
  color:var(--primary);
  font-weight:700;
}

.intensity-bar-bg {
  width:100%;
  height:10px;
  background:#000;
  border-radius:5px;
  overflow:hidden;
  border:1px solid #1a1a29;
}

.intensity-bar-fill {
  height:100%;
  width:20%;
  background:linear-gradient(90deg,#00f0ff,#7000ff);
  box-shadow:0 0 8px rgba(0,240,255,.5);
  transition:width .5s ease-out,background .3s ease;
}

.status-box {
  background:#06060c;
  border:2px solid var(--primary);
  border-radius:16px;
  padding:20px;
  margin:10px 0;
  transition:all .3s cubic-bezier(.4,0,.2,1);
  box-shadow:0 0 25px rgba(0,240,255,.1);
}

.status-box.pause {
  border-color:var(--stop);
  box-shadow:0 0 35px rgba(255,0,85,.35);
}

.status-box.release {
  border-color:var(--cum);
  box-shadow:0 0 45px rgba(255,255,255,.8);
  animation:pulseGlow 1s infinite alternate;
}

@keyframes pulseGlow {
  from {box-shadow:0 0 20px rgba(255,255,255,.4);}
  to {box-shadow:0 0 50px rgba(255,255,255,.9);}
}

.prompt-text {
  font-size:1.3rem;
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:2px;
  color:var(--primary);
}

.status-box.pause .prompt-text {
  color:var(--stop);
}

.status-box.release .prompt-text {
  color:var(--cum);
}

.sub-prompt {
  font-size:.9rem;
  color:#8a8a9e;
  margin-top:6px;
  font-weight:500;
}

.technique-tag {
  display:inline-block;
  margin-top:10px;
  background:rgba(0,240,255,.1);
  color:var(--primary);
  border:1px solid var(--primary);
  font-size:.75rem;
  padding:4px 12px;
  border-radius:20px;
  text-transform:uppercase;
  font-weight:600;
  letter-spacing:1px;
}

.status-box.pause .technique-tag {
  border-color:var(--stop);
  color:var(--stop);
  background:rgba(255,0,85,.1);
}

.status-box.release .technique-tag {
  border-color:var(--cum);
  color:var(--cum);
  background:rgba(255,255,255,.15);
}

.control-panel {
  display:flex;
  flex-direction:column;
  gap:10px;
  margin-top:15px;
}

.mode-select {
  background:#06060c;
  color:var(--primary);
  border:1px solid #22223a;
  padding:12px;
  border-radius:8px;
  font-weight:bold;
  width:100%;
  font-size:.85rem;
  text-transform:uppercase;
  letter-spacing:1px;
  outline:none;
}

.stats-row {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin:15px 0 5px;
}

.stat-card {
  background:#06060c;
  padding:12px;
  border-radius:10px;
  border:1px solid #161626;
}

.stat-val {
  font-size:1.4rem;
  font-weight:700;
  color:var(--primary);
}

.stat-lbl {
  font-size:.7rem;
  color:#6c6c80;
  text-transform:uppercase;
  letter-spacing:1px;
  margin-top:2px;
}

button.action-btn {
  background:linear-gradient(135deg,var(--accent),var(--primary));
  color:#fff;
  border:none;
  padding:16px;
  border-radius:10px;
  font-weight:700;
  cursor:pointer;
  text-transform:uppercase;
  letter-spacing:1.5px;
  transition:transform .1s,opacity .2s;
  font-size:.9rem;
  width:100%;
}

button.action-btn:active {
  transform:scale(.98);
}

button.edge-btn {
  background:linear-gradient(135deg,#ff0055,#ff5500);
}

button.cummed-btn {
  background:linear-gradient(135deg,#fff,#dcdcdc);
  color:#000;
  font-size:1rem;
  font-weight:800;
  box-shadow:0 0 25px rgba(255,255,255,.8);
  animation:pulseBtn 1s infinite alternate;
}

@keyframes pulseBtn {
  from {
    transform:scale(1);
    box-shadow:0 0 15px rgba(255,255,255,.5);
  }
  to {
    transform:scale(1.02);
    box-shadow:0 0 30px rgba(255,255,255,.95);
  }
}
</style>
</head>

<body>

<canvas id="fxCanvas"></canvas>

<div class="app-layout">

<div class="container">

<h1>Apex Edge Trainer</h1>

<select id="modeSelect" class="mode-select">
<option value="burst1">Mode: Ultra Burst (1 min)</option>
<option value="burst2">Mode: Sprint Edge (2 mins)</option>
<option value="quick">Mode: Quick Edge (3-5 mins)</option>
<option value="warmup">Mode: Warm-Up (15 mins)</option>
<option value="standard" selected>Mode: Standard Balanced (25 mins)</option>
<option value="endurance">Mode: Endurance Hold (40 mins)</option>
<option value="ladder">Mode: Ladder Surge (20 mins)</option>
<option value="toy">Mode: Marathon (2-3 hrs)</option>
</select>

<div class="visualizer-wrapper">
<canvas id="pulseCanvas" class="main-canvas" width="200" height="200"></canvas>
<div class="timer-overlay" id="mainTimer">00:00:00</div>
</div>

<div class="progress-bar-container">
<div class="progress-bar-fill" id="sessionProgressBar"></div>
</div>

<div class="intensity-container">
<div class="intensity-header">
<span>Target Intensity Level</span>
<span id="intensityLabel">20% (Low)</span>
</div>

<div class="intensity-bar-bg">
<div class="intensity-bar-fill" id="intensityBarFill"></div>
</div>
</div>

<div class="status-box" id="statusBox">

<div class="prompt-text" id="promptText">READY</div>

<div class="sub-prompt" id="subPrompt">
Select a mode and start the guided session.
</div>

<div class="technique-tag" id="techniqueTag" style="display:none;">
Technique
</div>

</div>

<div class="stats-row">

<div class="stat-card">
<div class="stat-val" id="edgeCount">0</div>
<div class="stat-lbl">Edges</div>
</div>

<div class="stat-card">
<div class="stat-val" id="phaseTimer">--</div>
<div class="stat-lbl">Next Cue</div>
</div>

</div>

<div class="control-panel">

<button id="startBtn"
class="action-btn"
onclick="toggleSession()">
Start Session
</button>

<button id="edgeBtn"
class="action-btn edge-btn"
onclick="logEdge()"
style="display:none;">
GOT CLOSE OR EDGED
</button>

<button id="cummedBtn"
class="action-btn cummed-btn"
onclick="finishClimaxSession()"
style="display:none;">
FINISH SESSION
</button>

</div>

</div>

<div class="stroke-panel">

<div class="stroke-title">
Motion Guide
</div>

<div class="stroke-canvas-container">
<canvas id="strokeCanvas" width="160" height="300"></canvas>
</div>

</div>

</div>

<script>

/* =========================================================
   CORE STATE
========================================================= */

let active=false;
let seconds=0;
let edges=0;
let totalSessionSeconds=1500;

let timerInterval=null;
let phaseInterval=null;

let phaseTimeLeft=0;
let currentPhase='idle';

let targetIntensity=20;
let ladderStep=0;


/* =========================================================
   AUDIO
========================================================= */

const synth=window.speechSynthesis;

const audioCtx=
new(window.AudioContext||window.webkitAudioContext)();

let trainerVoice=null;

function setTrainerVoice(){

if(!synth)return;

const voices=synth.getVoices();

trainerVoice=
voices.find(v =>
v.lang.includes('en') &&
(
v.name.includes('Male') ||
v.name.includes('David') ||
v.name.includes('Daniel')
)
) || voices[0];

}

if(synth){

setTrainerVoice();

if(synth.onvoiceschanged!==undefined){
synth.onvoiceschanged=setTrainerVoice;
}

}


/* =========================================================
   DYNAMIC FINISH COMMAND GENERATOR
========================================================= */

const compliments = [
  "You handled that like an absolute legend.",
  "Outstanding discipline and control throughout.",
  "That was a masterclass performance.",
  "Pure dedication, you built up incredible power.",
  "An absolute champion effort from start to finish.",
  "Your control is top tier, unbeatable session.",
  "Incredible endurance, you earned every bit of this."
];

function getRandomFinishCue() {
  const comp = compliments[Math.floor(Math.random() * compliments.length)];
  return `Now you are allowed to shoot that cum out of the long harvest. ${comp}`;
}


/* =========================================================
   CONVERSATIONAL TRAINER VOICE
========================================================= */

const rawVoice={

start:[
"Alright, you're in. Let's get this damn session moving.",
"Okay, we're live. No messing around now. Stay with the pace.",
"Let's go. Keep your head in the game and follow the cues.",
"You're on the clock. Stay focused and let's get moving."
],

action:[
"Come on, keep that pace. Don't get sloppy.",
"That's it. Stay steady and keep pushing.",
"Pick it up. You've got more in you.",
"Good rhythm. Don't lose it now.",
"Keep going. Breathe, stay controlled, and don't rush.",
"Alright, push the pace a little. You've got this.",
"That's better. Stay locked in and keep moving.",
"Come on. Keep working. Don't quit on me now."
],

highIntensity:[
"Alright, here we go. High intensity. Stay sharp.",
"Push hard now. Don't lose control.",
"Come on, keep driving. This is the tough part.",
"You're getting close to the limit. Stay controlled.",
"That's it. Keep the pressure on and stay focused.",
"No slacking now. Hold that pace.",
"Come on. This is where you earn the damn result."
],

pause:[
"Stop. Hands off and breathe.",
"Alright, freeze there. Take a breath.",
"Easy. Back off for a second and recover.",
"Hold it. Don't rush the next round.",
"Good. Take the damn break and reset.",
"Relax for a moment. The next round is coming.",
"Stop right there. Breathe and get your control back."
],

edge:[
"Edge recorded. Freeze there and recover.",
"Nice catch. That's another edge logged.",
"Good control. Stop and reset before the next push.",
"Recorded. Don't get carried away. Take your break.",
"You edged again. Breathe and get ready.",
"Logged. Stay calm and wait for the next cue."
],

finish:[
"That's it. You made it through the session.",
"Session complete. Nice work.",
"You hit the target. That's a wrap.",
"Done. You pushed through the whole damn session.",
"That's the finish. Good job staying with it."
],

manualStop:[
"Session stopped. You put in the work.",
"Alright, stopping here. Not bad.",
"Session terminated. You got your work in.",
"We're done for now. Good effort."
]

};

function randomRawLine(group){

const lines=rawVoice[group];

return lines[
Math.floor(Math.random()*lines.length)
];

}

function speak(text){

if(!synth)return;

synth.cancel();

const utterance=
new SpeechSynthesisUtterance(text);

if(trainerVoice)
utterance.voice=trainerVoice;

utterance.rate=1.05;
utterance.pitch=.85;
utterance.volume=1;

synth.speak(utterance);

}


/* =========================================================
   SOUND EFFECTS
========================================================= */

function playTone(
freq=440,
type='sine',
duration=.15
){

if(audioCtx.state==='suspended')
audioCtx.resume();

const osc=audioCtx.createOscillator();
const gain=audioCtx.createGain();

osc.type=type;
osc.frequency.value=freq;

gain.gain.setValueAtTime(
.1,
audioCtx.currentTime
);

gain.gain.exponentialRampToValueAtTime(
.01,
audioCtx.currentTime+duration
);

osc.connect(gain);
gain.connect(audioCtx.destination);

osc.start();

osc.stop(
audioCtx.currentTime+duration
);

}


/* =========================================================
   FULL SCREEN SPLASH FX
========================================================= */

const fxCanvas=
document.getElementById('fxCanvas');

const fxCtx=
fxCanvas.getContext('2d');

let drops=[];
let drips=[];
let splatters=[];
let fxActive=false;

function resizeFxCanvas(){

fxCanvas.width=window.innerWidth;
fxCanvas.height=window.innerHeight;

}

window.addEventListener(
'resize',
resizeFxCanvas
);

resizeFxCanvas();


function createSplashParticles(){

drops=[];
drips=[];
splatters=[];

const cx=fxCanvas.width/2;
const cy=fxCanvas.height/2;


/* central burst */

for(let i=0;i<120;i++){

const angle=
Math.random()*Math.PI*2;

const speed=
Math.random()*18+5;

drops.push({

x:cx,
y:cy,

vx:Math.cos(angle)*speed,
vy:Math.sin(angle)*speed-
(Math.random()*8+3),

radius:Math.random()*18+6,

viscosity:
Math.random()*.15+.82,

opacity:
Math.random()*.2+.8,

splatOnBoundary:true

});

}


/* background droplets */

for(let i=0;i<50;i++){

drips.push({

x:Math.random()*fxCanvas.width,

y:Math.random()*-100,

vy:Math.random()*1.5+.5,

radius:Math.random()*14+6,

length:Math.random()*60+30

});

}

}


function drawBlob(
ctx,
x,
y,
radius,
angle,
scale,
opacity
){

ctx.save();

ctx.translate(x,y);
ctx.rotate(angle);
ctx.scale(1,scale);

ctx.beginPath();

ctx.arc(
0,
0,
radius,
0,
Math.PI*2
);

ctx.fillStyle=
`rgba(255,255,255,${opacity})`;

ctx.shadowColor=
'rgba(255,255,255,.8)';

ctx.shadowBlur=15;

ctx.fill();

ctx.shadowBlur=0;

ctx.beginPath();

ctx.ellipse(
-radius*.3,
-radius*.3,
radius*.35,
radius*.2,
Math.PI/4,
0,
Math.PI*2
);

ctx.fillStyle=
'rgba(255,255,255,.95)';

ctx.fill();

ctx.restore();

}


function renderFx(){

fxCtx.clearRect(
0,
0,
fxCanvas.width,
fxCanvas.height
);

if(fxActive){

/* splatter marks */

for(const s of splatters){

fxCtx.save();

fxCtx.beginPath();

fxCtx.ellipse(
s.x,
s.y,
s.rx,
s.ry,
s.angle,
0,
Math.PI*2
);

fxCtx.fillStyle=
`rgba(255,255,255,${s.opacity})`;

fxCtx.shadowColor=
'rgba(255,255,255,.5)';

fxCtx.shadowBlur=8;

fxCtx.fill();

fxCtx.restore();

}


/* flying particles */

for(const p of drops){

const velocity=
Math.hypot(p.vx,p.vy);

const angle=
Math.atan2(p.vy,p.vx);

const scale=
Math.max(.4,1-velocity*.03);

drawBlob(
fxCtx,
p.x,
p.y,
p.radius,
angle,
scale,
p.opacity
);

p.x+=p.vx;
p.y+=p.vy;

p.vx*=p.viscosity;

p.vy=
p.vy*p.viscosity+.45;


/* screen collision */

if(
p.x<=p.radius ||
p.x>=fxCanvas.width-p.radius ||
p.y>=fxCanvas.height-p.radius
){

splatters.push({

x:Math.max(
p.radius,
Math.min(
fxCanvas.width-p.radius,
p.x
)
),

y:Math.max(
p.radius,
Math.min(
fxCanvas.height-p.radius,
p.y
)
),

rx:p.radius*
(Math.random()*.8+1.2),

ry:p.radius*
(Math.random()*.4+.5),

angle:Math.random()*Math.PI,

opacity:p.opacity

});

p.radius=0;

}

}


/* falling droplets */

for(const d of drips){

fxCtx.save();

fxCtx.beginPath();

fxCtx.arc(
d.x,
d.y,
d.radius,
0,
Math.PI*2
);

fxCtx.fillStyle=
'rgba(255,255,255,.92)';

fxCtx.shadowColor=
'rgba(255,255,255,.6)';

fxCtx.shadowBlur=10;

fxCtx.fill();

fxCtx.restore();

d.y+=d.vy;

d.vy+=.03;

d.length=
Math.min(
120,
d.length+d.vy*.8
);

if(d.y>fxCanvas.height+150){

d.y=Math.random()*-50;
d.x=Math.random()*fxCanvas.width;
d.vy=Math.random()*1.5+.5;
d.length=Math.random()*60+30;

}

}

}

requestAnimationFrame(renderFx);

}

renderFx();


/* =========================================================
   MAIN VISUALIZER
========================================================= */

const mainCanvas=
document.getElementById('pulseCanvas');

const mainCtx=
mainCanvas.getContext('2d');

let pulseAngle=0;


/* =========================================================
   MOTION GUIDE
========================================================= */

const strokeCanvas=
document.getElementById('strokeCanvas');

const strokeCtx=
strokeCanvas.getContext('2d');

let strokePos=.85;
let strokeDirection=1;

let strokeSpeed=.03;

let strokeRangeMin=.2;
let strokeRangeMax=.8;

let handsCount=1;
let activeHandSide='right';


/* =========================================================
   INTENSITY
========================================================= */

function updateIntensityMeter(value){

targetIntensity=
Math.min(
100,
Math.max(5,value)
);

const bar=
document.getElementById(
'intensityBarFill'
);

const label=
document.getElementById(
'intensityLabel'
);

bar.style.width=
`${targetIntensity}%`;

let desc='Low';

if(targetIntensity>=85){

desc='Extreme';

bar.style.background=
'linear-gradient(90deg,#ff0055,#ff5500)';

}
else if(targetIntensity>=65){

desc='High';

bar.style.background=
'linear-gradient(90deg,#7000ff,#ff0055)';

}
else if(targetIntensity>=40){

desc='Moderate';

bar.style.background=
'linear-gradient(90deg,#00f0ff,#7000ff)';

}
else if(targetIntensity>=20){

desc='Controlled';

bar.style.background=
'linear-gradient(90deg,#00f0ff,#ffffff)';

}
else{

desc='Cooling';

bar.style.background='#fff';

}

label.innerText=
`${Math.round(targetIntensity)}% (${desc})`;

}


/* =========================================================
   HAND GUIDE
========================================================= */

function drawHandGrip(
x,
y,
isRightSide,
color
){

strokeCtx.save();

const flip=
isRightSide?1:-1;

strokeCtx.beginPath();

strokeCtx.moveTo(
x-(30*flip),
y-12
);

strokeCtx.bezierCurveTo(
x-(38*flip),
y-6,
x-(38*flip),
y+16,
x-(24*flip),
y+18
);

strokeCtx.lineTo(
x+(24*flip),
y+18
);

strokeCtx.bezierCurveTo(
x+(34*flip),
y+16,
x+(34*flip),
y-8,
x+(24*flip),
y-12
);

strokeCtx.closePath();

strokeCtx.fillStyle=color;

strokeCtx.shadowBlur=12;
strokeCtx.shadowColor=color;

strokeCtx.fill();

strokeCtx.shadowBlur=0;

strokeCtx.strokeStyle='#040406';
strokeCtx.lineWidth=2;

for(let i=-4;i<=8;i+=6){

strokeCtx.beginPath();

strokeCtx.moveTo(
x-(8*flip),
y+i
);

strokeCtx.lineTo(
x+(26*flip),
y+i
);

strokeCtx.stroke();

}

strokeCtx.restore();

}


/* =========================================================
   ANIMATION LOOP
========================================================= */

function renderAnimations(){

mainCtx.clearRect(
0,
0,
mainCanvas.width,
mainCanvas.height
);

const cx=mainCanvas.width/2;
const cy=mainCanvas.height/2;

const mult=
targetIntensity/50;

if(active){

pulseAngle+=
(
currentPhase==='action'||
currentPhase==='release'
? .05
: .02
)*mult;

const radius=
75+
Math.sin(pulseAngle)*
(
currentPhase==='action'||
currentPhase==='release'
?7
:2
);

mainCtx.beginPath();

mainCtx.arc(
cx,
cy,
radius,
0,
Math.PI*2
);

const color=
currentPhase==='release'
?'#fff':
currentPhase==='action'
?'#00f0ff':
'#ff0055';

mainCtx.strokeStyle=color;
mainCtx.lineWidth=4;

mainCtx.shadowBlur=15;
mainCtx.shadowColor=color;

mainCtx.stroke();

}
else{

mainCtx.beginPath();

mainCtx.arc(
cx,
cy,
75,
0,
Math.PI*2
);

mainCtx.strokeStyle='#1a1a29';
mainCtx.lineWidth=2;
mainCtx.shadowBlur=0;

mainCtx.stroke();

}


/* motion guide */

strokeCtx.clearRect(
0,
0,
strokeCanvas.width,
strokeCanvas.height
);

const w=strokeCanvas.width;
const h=strokeCanvas.height;

const midX=w/2;
const topY=30;
const bottomY=h-65;

const totalLen=
bottomY-topY;

const strokeColor=
currentPhase==='release'
?'#fff':
currentPhase==='action'
?'#00f0ff':
'#ff0055';

const fillColor=
currentPhase==='release'
?'rgba(255,255,255,.2)':
currentPhase==='action'
?'rgba(0,240,255,.08)':
'rgba(255,0,85,.08)';

const shaftHalfWidth=25;
const lowerWidth=40;


/* guide shape */

strokeCtx.beginPath();

strokeCtx.moveTo(
midX-25,
topY+48
);

strokeCtx.lineTo(
midX-32,
topY+42
);

strokeCtx.bezierCurveTo(
midX-32,
topY+12,
midX-18,
topY,
midX,
topY
);

strokeCtx.bezierCurveTo(
midX+18,
topY,
midX+32,
topY+12,
midX+32,
topY+42
);

strokeCtx.lineTo(
midX+25,
topY+48
);

strokeCtx.lineTo(
midX+shaftHalfWidth,
bottomY-7
);

strokeCtx.bezierCurveTo(
midX+lowerWidth,
bottomY+8,
midX+lowerWidth,
bottomY+30,
midX+24,
bottomY+40
);

strokeCtx.bezierCurveTo(
midX+16,
bottomY+44,
midX+7,
bottomY+45,
midX,
bottomY+43
);

strokeCtx.bezierCurveTo(
midX-7,
bottomY+45,
midX-16,
bottomY+44,
midX-24,
bottomY+40
);

strokeCtx.bezierCurveTo(
midX-lowerWidth,
bottomY+30,
midX-lowerWidth,
bottomY+8,
midX-shaftHalfWidth,
bottomY-7
);

strokeCtx.lineTo(
midX-25,
topY+48
);

strokeCtx.closePath();

strokeCtx.fillStyle=fillColor;
strokeCtx.fill();

strokeCtx.strokeStyle=strokeColor;
strokeCtx.lineWidth=2;
strokeCtx.stroke();


/* motion */

if(
active &&
(
currentPhase==='action'||
currentPhase==='release'
)
){

strokePos+=
strokeSpeed*
strokeDirection*
mult;

if(strokePos>=strokeRangeMax){

strokePos=strokeRangeMax;
strokeDirection=-1;

}

else if(strokePos<=strokeRangeMin){

strokePos=strokeRangeMin;
strokeDirection=1;

}

}
else if(
active &&
currentPhase==='pause'
){

strokePos+=
(.85-strokePos)*.1;

}
else{

strokePos=.85;

}

const currentY=
topY+
strokePos*
totalLen;

const handColor=
currentPhase==='release'
?'rgba(255,255,255,.95)':
currentPhase==='action'
?'rgba(0,240,255,.88)':
'rgba(255,0,85,.88)';

drawHandGrip(
midX,
currentY,
activeHandSide==='right',
handColor
);

requestAnimationFrame(
renderAnimations
);

}

renderAnimations();


/* =========================================================
   DISPLAY
========================================================= */

function updateDisplay(){

const hrs=
String(
Math.floor(seconds/3600)
).padStart(2,'0');

const mins=
String(
Math.floor((seconds%3600)/60)
).padStart(2,'0');

const secs=
String(seconds%60)
.padStart(2,'0');

document.getElementById(
'mainTimer'
).innerText=
`${hrs}:${mins}:${secs}`;

const progress=
Math.min(
100,
(seconds/totalSessionSeconds)*100
);

document.getElementById(
'sessionProgressBar'
).style.width=
`${progress}%`;

}


/* =========================================================
   SESSION LENGTH
========================================================= */

function setSessionDuration(mode){

if(mode==='burst1')
totalSessionSeconds=60;

else if(mode==='burst2')
totalSessionSeconds=120;

else if(mode==='quick')
totalSessionSeconds=
Math.floor(Math.random()*120)+180;

else if(mode==='warmup')
totalSessionSeconds=900;

else if(mode==='standard')
totalSessionSeconds=1500;

else if(mode==='endurance')
totalSessionSeconds=2400;

else if(mode==='ladder')
totalSessionSeconds=1200;

else if(mode==='toy')
totalSessionSeconds=
Math.floor(Math.random()*3600)+7200;

}


/* =========================================================
   START / STOP
========================================================= */

function toggleSession(){

if(!active){

active=true;

seconds=0;
edges=0;
ladderStep=0;

fxActive=false;

const mode=
document.getElementById(
'modeSelect'
).value;

setSessionDuration(mode);

document.getElementById(
'edgeCount'
).innerText='0';

document.getElementById(
'modeSelect'
).disabled=true;

document.getElementById(
'startBtn'
).innerText='Stop Session';

document.getElementById(
'edgeBtn'
).style.display='block';

document.getElementById(
'cummedBtn'
).style.display='none';

document.getElementById(
'techniqueTag'
).style.display='inline-block';


timerInterval=
setInterval(()=>{

seconds++;

updateDisplay();

if(
seconds>=totalSessionSeconds &&
currentPhase!=='release'
){

triggerReleasePhase();

}

},1000);


playTone(660,'sine',.2);

speak(
randomRawLine('start')
);

startNextPhase('action');

}
else{

endSession();

}

}


/* =========================================================
   RELEASE / FINISH PHASE
========================================================= */

function triggerReleasePhase(){

clearInterval(phaseInterval);

currentPhase='release';

fxActive=true;

createSplashParticles();

const box=
document.getElementById(
'statusBox'
);

box.className=
'status-box release';

updateIntensityMeter(100);

const finishMessage = getRandomFinishCue();

document.getElementById(
'promptText'
).innerText=
'RELEASE ALLOWED';

document.getElementById(
'subPrompt'
).innerText=
finishMessage;

document.getElementById(
'techniqueTag'
).innerText=
'Status: Final Release';

document.getElementById(
'phaseTimer'
).innerText='GO!';

document.getElementById(
'startBtn'
).style.display='none';

document.getElementById(
'edgeBtn'
).style.display='none';

document.getElementById(
'cummedBtn'
).style.display='block';

playTone(880,'sine',.5);

speak(finishMessage);

}


/* =========================================================
   FINISH BUTTON
========================================================= */

function finishClimaxSession(){

playTone(990,'sine',.6);

speak(
`${randomRawLine('finish')} You edged ${edges} ${edges === 1 ? 'time' : 'times'}.`
);

endSession('climax');

}


/* =========================================================
   PHASE ENGINE
========================================================= */

function startNextPhase(forcedPhase=null){

if(currentPhase==='release')
return;

clearInterval(phaseInterval);

if(forcedPhase){

currentPhase=forcedPhase;

}
else{

currentPhase=
currentPhase==='action'
?'pause'
:'action';

}

const mode=
document.getElementById(
'modeSelect'
).value;

const box=
document.getElementById(
'statusBox'
);

const prompt=
document.getElementById(
'promptText'
);

const sub=
document.getElementById(
'subPrompt'
);

const tag=
document.getElementById(
'techniqueTag'
);


/* ACTION */

if(currentPhase==='action'){

box.className='status-box';

playTone(520,'sine',.15);

ladderStep++;


if(mode==='burst1'){

updateIntensityMeter(
Math.min(
95,
70+ladderStep*10
)
);

phaseTimeLeft=12;

}

else if(mode==='burst2'){

updateIntensityMeter(
Math.min(
95,
60+ladderStep*10
)
);

phaseTimeLeft=15;

}

else if(mode==='quick'){

updateIntensityMeter(
Math.min(
95,
50+ladderStep*15
)
);

phaseTimeLeft=20;

}

else if(mode==='warmup'){

updateIntensityMeter(
25+Math.sin(ladderStep)*10
);

phaseTimeLeft=
Math.floor(
Math.random()*10+25
);

}

else if(mode==='standard'){

updateIntensityMeter(
Math.min(
85,
40+ladderStep*6
)
);

phaseTimeLeft=
Math.floor(
Math.random()*15+20
);

}

else if(mode==='endurance'){

updateIntensityMeter(
60+(ladderStep%3)*10
);

phaseTimeLeft=
Math.floor(
Math.random()*20+35
);

}

else if(mode==='ladder'){

const stepVal=
(ladderStep%5)*18+20;

updateIntensityMeter(stepVal);

phaseTimeLeft=15;

}

else if(mode==='toy'){

updateIntensityMeter(
Math.min(
80,
35+ladderStep*3
)
);

phaseTimeLeft=
Math.floor(
Math.random()*30+45
);

}


phaseTimeLeft=
Math.max(
3,
phaseTimeLeft
);


strokeSpeed=
mode==='burst1'||mode==='burst2'
?.08
:mode==='quick'
?.06
:.035;

strokeRangeMin=.1;
strokeRangeMax=.85;

handsCount=1;
activeHandSide='right';


prompt.innerText=
'BUILD / PUSH';

sub.innerText=
`${randomRawLine('action')} Target ${Math.round(targetIntensity)}% intensity.`;

tag.innerText=
'Focus: Controlled Pace';


/* conversational voice */

if(targetIntensity>=70){

speak(
randomRawLine('highIntensity')
);

}
else{

speak(
randomRawLine('action')
);

}

}


/* PAUSE */

else{

box.className='status-box pause';

playTone(280,'triangle',.3);

updateIntensityMeter(
Math.max(
5,
targetIntensity*.2
)
);


if(mode==='burst1')
phaseTimeLeft=3;

else if(mode==='burst2')
phaseTimeLeft=4;

else if(mode==='quick')
phaseTimeLeft=5;

else if(mode==='toy')
phaseTimeLeft=
Math.floor(
Math.random()*15
)+15;

else
phaseTimeLeft=
Math.floor(
Math.random()*10
)+8;


prompt.innerText=
'HALT / RESET';

sub.innerText=
'Back off, breathe, and get ready for the next round.';

tag.innerText=
'Focus: Recovery';

speak(
randomRawLine('pause')
);

}


document.getElementById(
'phaseTimer'
).innerText=
`${phaseTimeLeft}s`;


phaseInterval=
setInterval(()=>{

phaseTimeLeft--;

document.getElementById(
'phaseTimer'
).innerText=
`${phaseTimeLeft}s`;

if(phaseTimeLeft<=0){

startNextPhase();

}

},1000);

}


/* =========================================================
   LOG ROUND
========================================================= */

function logEdge(){

if(
!active ||
currentPhase==='release'
)
return;

edges++;

document.getElementById(
'edgeCount'
).innerText=
edges;

playTone(
200,
'sawtooth',
.4
);

speak(
randomRawLine('edge')
);

startNextPhase('pause');

}


/* =========================================================
   END SESSION
========================================================= */

function endSession(reason='manual'){

active=false;

fxActive=false;

clearInterval(timerInterval);
clearInterval(phaseInterval);

fxCtx.clearRect(
0,
0,
fxCanvas.width,
fxCanvas.height
);

document.getElementById(
'modeSelect'
).disabled=false;

document.getElementById(
'startBtn'
).style.display='block';

document.getElementById(
'startBtn'
).innerText=
'Start Session';

document.getElementById(
'edgeBtn'
).style.display='none';

document.getElementById(
'cummedBtn'
).style.display='none';

document.getElementById(
'techniqueTag'
).style.display='none';


document.getElementById(
'promptText'
).innerText=
reason==='climax'
?'COMPLETE'
:'STOPPED';

document.getElementById(
'subPrompt'
).innerText=
reason==='climax'
?
`Session completed. You edged ${edges} ${edges === 1 ? 'time' : 'times'}.`
:
'Training session stopped.';


document.getElementById(
'statusBox'
).className=
'status-box';

document.getElementById(
'phaseTimer'
).innerText='--';

document.getElementById(
'sessionProgressBar'
).style.width='0%';

updateIntensityMeter(10);


if(reason==='manual'){

playTone(
440,
'sine',
.3
);

speak(
`${randomRawLine('manualStop')} You edged ${edges} ${edges === 1 ? 'time' : 'times'}.`
);

}

}


/* =========================================================
   INITIAL STATE
========================================================= */

updateIntensityMeter(20);

</script>

</body>
</html>
