<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apex Edge Trainer</title>
  <style>
    :root {
      --bg: #040406;
      --card: #0a0a12;
      --primary: #00f0ff;
      --accent: #7000ff;
      --stop: #ff0055;
      --text: #e0e6ed;
      --glow: rgba(0, 240, 255, 0.15);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, system-ui, sans-serif; }
    body { background: var(--bg); color: var(--text); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; overflow-x: hidden; }
    
    .app-layout { display: flex; flex-direction: row; gap: 20px; width: 100%; max-width: 820px; align-items: stretch; justify-content: center; }
    
    .container { flex: 1; min-width: 320px; background: var(--card); border: 1px solid #1a1a29; border-radius: 24px; padding: 28px; box-shadow: 0 0 50px var(--glow); text-align: center; position: relative; z-index: 1; }
    
    .stroke-panel { width: 220px; background: var(--card); border: 1px solid #1a1a29; border-radius: 24px; padding: 20px; display: flex; flex-direction: column; align-items: center; justify-content: space-between; box-shadow: 0 0 30px rgba(0, 0, 0, 0.5); }
    .stroke-title { font-size: 0.8rem; letter-spacing: 2px; text-transform: uppercase; color: var(--primary); margin-bottom: 10px; font-weight: 700; }
    .stroke-canvas-container { position: relative; width: 100%; height: 320px; display: flex; justify-content: center; }

    h1 { color: var(--primary); font-size: 1.3rem; letter-spacing: 3px; text-transform: uppercase; margin-bottom: 15px; text-shadow: 0 0 12px rgba(0, 240, 255, 0.6); }
    
    .visualizer-wrapper { position: relative; width: 200px; height: 200px; margin: 10px auto; display: flex; align-items: center; justify-content: center; }
    canvas.main-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
    .timer-overlay { position: relative; z-index: 2; font-size: 2.5rem; font-weight: 700; color: #fff; text-shadow: 0 0 15px var(--primary); font-variant-numeric: tabular-nums; }
    
    .progress-bar-container { width: 100%; height: 6px; background: #121220; border-radius: 3px; overflow: hidden; margin: 15px 0 20px 0; }
    .progress-bar-fill { height: 100%; width: 0%; background: var(--primary); transition: width 0.2s linear, background-color 0.3s ease; box-shadow: 0 0 10px var(--primary); }
    .status-box.pause .progress-bar-fill { background: var(--stop); box-shadow: 0 0 10px var(--stop); }

    .status-box { background: #06060c; border: 2px solid var(--primary); border-radius: 16px; padding: 20px; margin: 10px 0; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); box-shadow: 0 0 25px rgba(0, 240, 255, 0.1); }
    .status-box.pause { border-color: var(--stop); box-shadow: 0 0 35px rgba(255, 0, 85, 0.35); }
    
    .prompt-text { font-size: 1.3rem; font-weight: 700; text-transform: uppercase; letter-spacing: 2px; color: var(--primary); }
    .status-box.pause .prompt-text { color: var(--stop); }
    .sub-prompt { font-size: 0.9rem; color: #8a8a9e; margin-top: 6px; font-weight: 500; }
    .technique-tag { display: inline-block; margin-top: 10px; background: rgba(0, 240, 255, 0.1); color: var(--primary); border: 1px solid var(--primary); font-size: 0.75rem; padding: 4px 12px; border-radius: 20px; text-transform: uppercase; font-weight: 600; letter-spacing: 1px; }
    .status-box.pause .technique-tag { border-color: var(--stop); color: var(--stop); background: rgba(255, 0, 85, 0.1); }

    .control-panel { display: flex; flex-direction: column; gap: 10px; margin-top: 15px; }
    .mode-select { background: #06060c; color: var(--primary); border: 1px solid #22223a; padding: 12px; border-radius: 8px; font-weight: bold; width: 100%; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px; outline: none; }
    
    .stats-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 15px 0 5px 0; }
    .stat-card { background: #06060c; padding: 12px; border-radius: 10px; border: 1px solid #161626; }
    .stat-val { font-size: 1.4rem; font-weight: 700; color: var(--primary); }
    .stat-lbl { font-size: 0.7rem; color: #6c6c80; text-transform: uppercase; letter-spacing: 1px; margin-top: 2px; }

    button { background: linear-gradient(135deg, var(--accent), var(--primary)); color: #fff; border: none; padding: 16px; border-radius: 10px; font-weight: 700; cursor: pointer; text-transform: uppercase; letter-spacing: 1.5px; transition: transform 0.1s, opacity 0.2s; font-size: 0.9rem; }
    button:active { transform: scale(0.98); }
    button.edge-btn { background: linear-gradient(135deg, #ff0055, #ff5500); margin-top: 5px; }

    @media (max-width: 680px) {
      .app-layout { flex-direction: column; align-items: center; }
      .stroke-panel { width: 100%; height: auto; }
      .stroke-canvas-container { height: 220px; }
    }
  </style>
</head>
<body>

<div class="app-layout">
  <div class="container">
    <h1>Apex Edge Trainer</h1>
    
    <select id="modeSelect" class="mode-select">
      <option value="standard">Mode: Standard Balanced</option>
      <option value="endurance">Mode: Endurance (Long Action)</option>
      <option value="chaos">Mode: Chaos (Randomized Burst)</option>
    </select>

    <div class="visualizer-wrapper">
      <canvas id="pulseCanvas" class="main-canvas" width="200" height="200"></canvas>
      <div class="timer-overlay" id="mainTimer">00:00:00</div>
    </div>

    <div class="progress-bar-container">
      <div class="progress-bar-fill" id="phaseProgressBar"></div>
    </div>
    
    <div class="status-box" id="statusBox">
      <div class="prompt-text" id="promptText">READY</div>
      <div class="sub-prompt" id="subPrompt">Select mode and start training</div>
      <div class="technique-tag" id="techniqueTag" style="display:none;">Technique</div>
    </div>

    <div class="stats-row">
      <div class="stat-card">
        <div class="stat-val" id="edgeCount">0</div>
        <div class="stat-lbl">Edges Logged</div>
      </div>
      <div class="stat-card">
        <div class="stat-val" id="phaseTimer">--</div>
        <div class="stat-lbl">Next Cue</div>
      </div>
    </div>

    <div class="control-panel">
      <button id="startBtn" onclick="toggleSession()">Start Session</button>
      <button id="edgeBtn" class="edge-btn" onclick="logEdge()" style="display:none;">Edge Reached (Halt)</button>
    </div>
  </div>

  <div class="stroke-panel">
    <div class="stroke-title">Pacing Telemetry</div>
    <div class="stroke-canvas-container">
      <canvas id="strokeCanvas" width="160" height="300"></canvas>
    </div>
  </div>
</div>

<script>
  let active = false;
  let seconds = 0;
  let edges = 0;
  let timerInterval = null;
  let phaseInterval = null;
  let phaseTimeLeft = 0;
  let totalPhaseDuration = 1;
  let currentPhase = 'idle';

  const synth = window.speechSynthesis;
  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  let trainerVoice = null;

  function setTrainerVoice() {
    if (!synth) return;
    const voices = synth.getVoices();
    trainerVoice = voices.find(v => v.lang.includes('en') && (v.name.includes('Male') || v.name.includes('David') || v.name.includes('Daniel') || v.name.includes('Google UK English Male'))) || voices[0];
  }

  if (synth) {
    setTrainerVoice();
    if (synth.onvoiceschanged !== undefined) {
      synth.onvoiceschanged = setTrainerVoice;
    }
  }

  const mainCanvas = document.getElementById('pulseCanvas');
  const mainCtx = mainCanvas.getContext('2d');
  let pulseAngle = 0;

  const strokeCanvas = document.getElementById('strokeCanvas');
  const strokeCtx = strokeCanvas.getContext('2d');
  let gaugePos = 0;
  let gaugeDirection = 1;
  let strokeSpeed = 0.03;

  function renderAnimations() {
    mainCtx.clearRect(0, 0, mainCanvas.width, mainCanvas.height);
    const centerX = mainCanvas.width / 2;
    const centerY = mainCanvas.height / 2;
    
    if (active) {
      pulseAngle += currentPhase === 'action' ? 0.05 : 0.02;
      const radius = 75 + Math.sin(pulseAngle) * (currentPhase === 'action' ? 7 : 2);
      
      mainCtx.beginPath();
      mainCtx.arc(centerX, centerY, radius, 0, Math.PI * 2);
      mainCtx.strokeStyle = currentPhase === 'action' ? '#00f0ff' : '#ff0055';
      mainCtx.lineWidth = 4;
      mainCtx.shadowBlur = 15;
      mainCtx.shadowColor = currentPhase === 'action' ? '#00f0ff' : '#ff0055';
      mainCtx.stroke();
    } else {
      mainCtx.beginPath();
      mainCtx.arc(centerX, centerY, 75, 0, Math.PI * 2);
      mainCtx.strokeStyle = '#1a1a29';
      mainCtx.lineWidth = 2;
      mainCtx.shadowBlur = 0;
      mainCtx.stroke();
    }

    strokeCtx.clearRect(0, 0, strokeCanvas.width, strokeCanvas.height);
    
    const w = strokeCanvas.width;
    const h = strokeCanvas.height;
    const midX = w / 2;
    const topY = 20;
    const bottomY = h - 20;

    // Abstract Linear Telemetry Track
    strokeCtx.beginPath();
    strokeCtx.moveTo(midX, topY);
    strokeCtx.lineTo(midX, bottomY);
    strokeCtx.strokeStyle = '#1a1a29';
    strokeCtx.lineWidth = 6;
    strokeCtx.lineCap = 'round';
    strokeCtx.stroke();

    // Calibration Tick Marks
    for (let i = topY; i <= bottomY; i += 25) {
      strokeCtx.beginPath();
      strokeCtx.moveTo(midX - 12, i);
      strokeCtx.lineTo(midX + 12, i);
      strokeCtx.strokeStyle = '#22223a';
      strokeCtx.lineWidth = 2;
      strokeCtx.stroke();
    }

    if (active && currentPhase === 'action') {
      gaugePos += strokeSpeed * gaugeDirection;
      if (gaugePos >= 1) {
        gaugePos = 1;
        gaugeDirection = -1;
      } else if (gaugePos <= 0) {
        gaugePos = 0;
        gaugeDirection = 1;
      }
    } else {
      gaugePos += (0.5 - gaugePos) * 0.1;
    }

    const currentY = topY + gaugePos * (bottomY - topY);
    const activeColor = currentPhase === 'action' ? '#00f0ff' : '#ff0055';

    // Moving Pacing Indicator Node
    strokeCtx.beginPath();
    strokeCtx.arc(midX, currentY, 14, 0, Math.PI * 2);
    strokeCtx.fillStyle = activeColor;
    strokeCtx.shadowBlur = 15;
    strokeCtx.shadowColor = activeColor;
    strokeCtx.fill();
    strokeCtx.shadowBlur = 0;

    requestAnimationFrame(renderAnimations);
  }
  renderAnimations();

  function playTone(freq = 440, type = 'sine', duration = 0.15) {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
  }

  function speak(text) {
    if (!synth) return;
    synth.cancel();
    const utterance = new SpeechSynthesisUtterance(text);
    if (trainerVoice) utterance.voice = trainerVoice;
    
    utterance.rate = 1.0;
    utterance.pitch = 0.8;
    synth.speak(utterance);
  }

  function updateDisplay() {
    const hrs = String(Math.floor(seconds / 3600)).padStart(2, '0');
    const mins = String(Math.floor((seconds % 3600) / 60)).padStart(2, '0');
    const secs = String(seconds % 60).padStart(2, '0');
    document.getElementById('mainTimer').innerText = `${hrs}:${mins}:${secs}`;
  }

  function toggleSession() {
    if (!active) {
      active = true;
      seconds = 0;
      edges = 0;
      document.getElementById('edgeCount').innerText = '0';
      document.getElementById('modeSelect').disabled = true;
      document.getElementById('startBtn').innerText = 'Stop Session';
      document.getElementById('edgeBtn').style.display = 'block';
      document.getElementById('techniqueTag').style.display = 'inline-block';
      
      timerInterval = setInterval(() => { seconds++; updateDisplay(); }, 1000);
      playTone(660, 'sine', 0.2);
      speak("Session initiated. Maintain baseline cadence.");
      startNextPhase('action');
    } else {
      endSession();
    }
  }

  function startNextPhase(forcedPhase = null) {
    clearInterval(phaseInterval);
    
    if (forcedPhase) {
      currentPhase = forcedPhase;
    } else {
      currentPhase = currentPhase === 'action' ? 'pause' : 'action';
    }

    const mode = document.getElementById('modeSelect').value;
    const box = document.getElementById('statusBox');
    const prompt = document.getElementById('promptText');
    const sub = document.getElementById('subPrompt');
    const tag = document.getElementById('techniqueTag');

    if (currentPhase === 'action') {
      box.classList.remove('pause');
      playTone(520, 'sine', 0.15);
      
      if (mode === 'endurance') {
        phaseTimeLeft = Math.floor(Math.random() * 30) + 40;
      } else if (mode === 'chaos') {
        phaseTimeLeft = Math.floor(Math.random() * 25) + 10;
      } else {
        phaseTimeLeft = Math.floor(Math.random() * 20) + 25;
      }

      strokeSpeed = Math.random() * 0.03 + 0.02;

      prompt.innerText = "ACTION PHASE";
      sub.innerText = "Maintain designated tempo";
      tag.innerText = "Target: Steady Cadence";
      speak("Action phase active. Follow the pacing telemetry.");
    } else {
      box.classList.add('pause');
      playTone(280, 'triangle', 0.3);
      
      phaseTimeLeft = mode === 'chaos' ? Math.floor(Math.random() * 10) + 5 : Math.floor(Math.random() * 15) + 10;

      prompt.innerText = "REST / HOLD";
      sub.innerText = "Pause activity completely";
      tag.innerText = "Target: Heart Rate Reduction";
      speak("Hold phase active. Pause movement and focus on deep breathing.");
    }

    totalPhaseDuration = phaseTimeLeft;
    updateProgressBar();

    document.getElementById('phaseTimer').innerText = `${phaseTimeLeft}s`;

    phaseInterval = setInterval(() => {
      phaseTimeLeft--;
      document.getElementById('phaseTimer').innerText = `${phaseTimeLeft}s`;
      updateProgressBar();

      if (phaseTimeLeft <= 0) {
        startNextPhase();
      }
    }, 1000);
  }

  function updateProgressBar() {
    const percentage = ((totalPhaseDuration - phaseTimeLeft) / totalPhaseDuration) * 100;
    document.getElementById('phaseProgressBar').style.width = `${Math.min(100, Math.max(0, percentage))}%`;
  }

  function logEdge() {
    if (!active) return;
    edges++;
    document.getElementById('edgeCount').innerText = edges;
    playTone(200, 'sawtooth', 0.4);
    speak("Edge logged. Transitioning to rest phase.");
    startNextPhase('pause');
  }

  function endSession() {
    active = false;
    clearInterval(timerInterval);
    clearInterval(phaseInterval);
    
    document.getElementById('modeSelect').disabled = false;
    document.getElementById('startBtn').innerText = 'Start Session';
    document.getElementById('edgeBtn').style.display = 'none';
    document.getElementById('techniqueTag').style.display = 'none';
    document.getElementById('promptText').innerText = 'COMPLETE';
    document.getElementById('subPrompt').innerText = 'Session finished';
    document.getElementById('statusBox').classList.remove('pause');
    document.getElementById('phaseTimer').innerText = '--';
    document.getElementById('phaseProgressBar').style.width = '0%';

    playTone(440, 'sine', 0.3);
    speak(`Session finished. Total time ${Math.floor(seconds / 60)} minutes with ${edges} recorded intervals.`);
  }
</script>
</body>
</html>
