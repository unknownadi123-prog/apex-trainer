<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apex Edge Trainer</title>

  <style>
    :root {
      --bg: #040406;
      --card: #0a0a12;
      --primary: #00f0ff;
      --accent: #7000ff;
      --stop: #ff0055;
      --text: #e0e6ed;
      --glow: rgba(0, 240, 255, 0.15);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow-x: hidden;
    }

    .app-layout {
      display: flex;
      flex-direction: row;
      gap: 20px;
      width: 100%;
      max-width: 820px;
      align-items: stretch;
      justify-content: center;
    }

    .container {
      flex: 1;
      min-width: 320px;
      background: var(--card);
      border: 1px solid #1a1a29;
      border-radius: 24px;
      padding: 28px;
      box-shadow: 0 0 50px var(--glow);
      text-align: center;
      position: relative;
      z-index: 1;
    }

    .stroke-panel {
      width: 220px;
      background: var(--card);
      border: 1px solid #1a1a29;
      border-radius: 24px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.5);
    }

    .stroke-title {
      font-size: 0.8rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--primary);
      margin-bottom: 10px;
      font-weight: 700;
    }

    .stroke-canvas-container {
      position: relative;
      width: 100%;
      height: 320px;
      display: flex;
      justify-content: center;
    }

    h1 {
      color: var(--primary);
      font-size: 1.3rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 15px;
      text-shadow: 0 0 12px rgba(0, 240, 255, 0.6);
    }

    .visualizer-wrapper {
      position: relative;
      width: 200px;
      height: 200px;
      margin: 10px auto;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    canvas.main-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    .timer-overlay {
      position: relative;
      z-index: 2;
      font-size: 2.5rem;
      font-weight: 700;
      color: #fff;
      text-shadow: 0 0 15px var(--primary);
      font-variant-numeric: tabular-nums;
    }

    .progress-bar-container {
      width: 100%;
      height: 6px;
      background: #121220;
      border-radius: 3px;
      overflow: hidden;
      margin: 15px 0 10px 0;
    }

    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: var(--primary);
      transition: width 0.2s linear, background-color 0.3s ease;
      box-shadow: 0 0 10px var(--primary);
    }

    .status-box.pause .progress-bar-fill {
      background: var(--stop);
      box-shadow: 0 0 10px var(--stop);
    }

    /* Dynamic Intensity Controller Styles */
    .intensity-container {
      width: 100%;
      margin: 15px 0;
      background: #06060c;
      border: 1px solid #1a1a29;
      border-radius: 12px;
      padding: 10px 14px;
    }

    .intensity-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.75rem;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #8a8a9e;
      margin-bottom: 8px;
      font-weight: 600;
    }

    .intensity-header span:last-child {
      color: var(--primary);
      font-weight: 700;
    }

    .intensity-bar-wrapper {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .intensity-btn {
      background: #121220;
      color: var(--primary);
      border: 1px solid #22223a;
      width: 30px;
      height: 30px;
      border-radius: 6px;
      font-size: 1.1rem;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      padding: 0;
      transition: all 0.2s ease;
    }

    .intensity-btn:hover {
      background: var(--primary);
      color: #040406;
      box-shadow: 0 0 10px var(--primary);
    }

    .intensity-bar-bg {
      flex: 1;
      height: 10px;
      background: #000;
      border-radius: 5px;
      overflow: hidden;
      border: 1px solid #1a1a29;
    }

    .intensity-bar-fill {
      height: 100%;
      width: 50%;
      background: linear-gradient(90deg, #00f0ff, #7000ff);
      box-shadow: 0 0 8px rgba(0, 240, 255, 0.5);
      transition: width 0.2s ease, background 0.3s ease;
    }

    .status-box {
      background: #06060c;
      border: 2px solid var(--primary);
      border-radius: 16px;
      padding: 20px;
      margin: 10px 0;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 0 25px rgba(0, 240, 255, 0.1);
    }

    .status-box.pause {
      border-color: var(--stop);
      box-shadow: 0 0 35px rgba(255, 0, 85, 0.35);
    }

    .prompt-text {
      font-size: 1.3rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--primary);
    }

    .status-box.pause .prompt-text {
      color: var(--stop);
    }

    .sub-prompt {
      font-size: 0.9rem;
      color: #8a8a9e;
      margin-top: 6px;
      font-weight: 500;
    }

    .technique-tag {
      display: inline-block;
      margin-top: 10px;
      background: rgba(0, 240, 255, 0.1);
      color: var(--primary);
      border: 1px solid var(--primary);
      font-size: 0.75rem;
      padding: 4px 12px;
      border-radius: 20px;
      text-transform: uppercase;
      font-weight: 600;
      letter-spacing: 1px;
    }

    .status-box.pause .technique-tag {
      border-color: var(--stop);
      color: var(--stop);
      background: rgba(255, 0, 85, 0.1);
    }

    .control-panel {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 15px;
    }

    .mode-select {
      background: #06060c;
      color: var(--primary);
      border: 1px solid #22223a;
      padding: 12px;
      border-radius: 8px;
      font-weight: bold;
      width: 100%;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      outline: none;
    }

    .stats-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin: 15px 0 5px 0;
    }

    .stat-card {
      background: #06060c;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #161626;
    }

    .stat-val {
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--primary);
    }

    .stat-lbl {
      font-size: 0.7rem;
      color: #6c6c80;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-top: 2px;
    }

    button.action-btn {
      background: linear-gradient(135deg, var(--accent), var(--primary));
      color: #fff;
      border: none;
      padding: 16px;
      border-radius: 10px;
      font-weight: 700;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      transition: transform 0.1s, opacity 0.2s;
      font-size: 0.9rem;
      width: 100%;
    }

    button.action-btn:active {
      transform: scale(0.98);
    }

    button.edge-btn {
      background: linear-gradient(135deg, #ff0055, #ff5500);
      margin-top: 5px;
    }

    @media (max-width: 680px) {
      .app-layout {
        flex-direction: column;
        align-items: center;
      }

      .stroke-panel {
        width: 100%;
        height: auto;
      }

      .stroke-canvas-container {
        height: 220px;
      }
    }
  </style>
</head>

<body>

<div class="app-layout">

  <div class="container">

    <h1>Apex Edge Trainer</h1>

    <select id="modeSelect" class="mode-select">
      <option value="warmup">Mode: Warm-Up</option>
      <option value="standard" selected>Mode: Standard Balanced</option>
      <option value="endurance">Mode: Endurance Hold</option>
      <option value="ladder">Mode: Ladder Surge</option>
      <option value="chaos">Mode: Chaos Randomizer</option>
      <option value="extreme">Mode: Overload Edge</option>
    </select>

    <div class="visualizer-wrapper">
      <canvas id="pulseCanvas"
              class="main-canvas"
              width="200"
              height="200"></canvas>

      <div class="timer-overlay" id="mainTimer">
        00:00:00
      </div>
    </div>

    <div class="progress-bar-container">
      <div class="progress-bar-fill" id="phaseProgressBar"></div>
    </div>

    <!-- Active Interactive Intensity Controller -->
    <div class="intensity-container">
      <div class="intensity-header">
        <span>Current Intensity Goal</span>
        <span id="intensityLabel">50% (Moderate)</span>
      </div>
      <div class="intensity-bar-wrapper">
        <button class="intensity-btn" onclick="adjustIntensity(-10)">-</button>
        <div class="intensity-bar-bg">
          <div class="intensity-bar-fill" id="intensityBarFill"></div>
        </div>
        <button class="intensity-btn" onclick="adjustIntensity(10)">+</button>
      </div>
    </div>

    <div class="status-box" id="statusBox">

      <div class="prompt-text" id="promptText">
        READY
      </div>

      <div class="sub-prompt" id="subPrompt">
        Select mode and set intensity to start training
      </div>

      <div class="technique-tag"
           id="techniqueTag"
           style="display:none;">
        Technique
      </div>

    </div>

    <div class="stats-row">

      <div class="stat-card">
        <div class="stat-val" id="edgeCount">0</div>
        <div class="stat-lbl">Edges Logged</div>
      </div>

      <div class="stat-card">
        <div class="stat-val" id="phaseTimer">--</div>
        <div class="stat-lbl">Next Cue</div>
      </div>

    </div>

    <div class="control-panel">

      <button id="startBtn"
              class="action-btn"
              onclick="toggleSession()">
        Start Session
      </button>

      <button id="edgeBtn"
              class="action-btn edge-btn"
              onclick="logEdge()"
              style="display:none;">
        Edge Reached
      </button>

    </div>

  </div>


  <div class="stroke-panel">

    <div class="stroke-title">
      Anatomy Motion
    </div>

    <div class="stroke-canvas-container">

      <canvas id="strokeCanvas"
              width="160"
              height="300">
      </canvas>

    </div>

  </div>

</div>


<script>

  let active = false;
  let seconds = 0;
  let edges = 0;

  let timerInterval = null;
  let phaseInterval = null;

  let phaseTimeLeft = 0;
  let totalPhaseDuration = 1;

  let currentPhase = 'idle';
  let currentIntensityPct = 50; // Dynamic intensity scale (10% to 100%)

  const synth = window.speechSynthesis;

  const audioCtx =
    new (window.AudioContext ||
         window.webkitAudioContext)();

  let trainerVoice = null;


  function setTrainerVoice() {
    if (!synth) return;
    const voices = synth.getVoices();
    trainerVoice =
      voices.find(v =>
        v.lang.includes('en') &&
        (
          v.name.includes('Male') ||
          v.name.includes('David') ||
          v.name.includes('Daniel')
        )
      ) || voices[0];
  }


  if (synth) {
    setTrainerVoice();
    if (synth.onvoiceschanged !== undefined) {
      synth.onvoiceschanged = setTrainerVoice;
    }
  }


  const mainCanvas =
    document.getElementById('pulseCanvas');
  const mainCtx =
    mainCanvas.getContext('2d');
  let pulseAngle = 0;


  const strokeCanvas =
    document.getElementById('strokeCanvas');
  const strokeCtx =
    strokeCanvas.getContext('2d');

  let strokePos = 0;
  let strokeDirection = 1;
  let strokeSpeed = 0.03;
  let strokeRangeMin = 0.2;
  let strokeRangeMax = 0.8;
  let handsCount = 1;
  let activeHandSide = 'right';


  function adjustIntensity(delta) {
    currentIntensityPct = Math.min(100, Math.max(10, currentIntensityPct + delta));
    updateIntensityUI();
  }

  function updateIntensityUI() {
    const bar = document.getElementById('intensityBarFill');
    const label = document.getElementById('intensityLabel');

    bar.style.width = `${currentIntensityPct}%`;

    let desc = "Low";
    if (currentIntensityPct >= 80) {
      desc = "Extreme";
      bar.style.background = 'linear-gradient(90deg, #ff0055, #ff5500)';
    } else if (currentIntensityPct >= 50) {
      desc = "Moderate";
      bar.style.background = 'linear-gradient(90deg, #00f0ff, #7000ff)';
    } else {
      desc = "Low";
      bar.style.background = 'linear-gradient(90deg, #00f0ff, #00ffaa)';
    }

    label.innerText = `${currentIntensityPct}% (${desc})`;
  }


  function drawHandGrip(x, y, isRightSide, color) {
    strokeCtx.save();
    const flip = isRightSide ? 1 : -1;

    strokeCtx.beginPath();
    strokeCtx.moveTo(x - (30 * flip), y - 12);
    strokeCtx.bezierCurveTo(x - (38 * flip), y - 6, x - (38 * flip), y + 16, x - (24 * flip), y + 18);
    strokeCtx.lineTo(x + (24 * flip), y + 18);
    strokeCtx.bezierCurveTo(x + (34 * flip), y + 16, x + (34 * flip), y - 8, x + (24 * flip), y - 12);
    strokeCtx.closePath();

    strokeCtx.fillStyle = color;
    strokeCtx.shadowBlur = 12;
    strokeCtx.shadowColor = color;
    strokeCtx.fill();

    strokeCtx.beginPath();
    strokeCtx.ellipse(x - (18 * flip), y - 8, 12, 8, (isRightSide ? -1 : 1) * Math.PI / 6, 0, Math.PI * 2);
    strokeCtx.fill();

    strokeCtx.shadowBlur = 0;
    strokeCtx.strokeStyle = '#040406';
    strokeCtx.lineWidth = 2;

    for (let i = -4; i <= 8; i += 6) {
      strokeCtx.beginPath();
      strokeCtx.moveTo(x - (8 * flip), y + i);
      strokeCtx.lineTo(x + (26 * flip), y + i);
      strokeCtx.stroke();
    }

    strokeCtx.restore();
  }


  function renderAnimations() {
    mainCtx.clearRect(0, 0, mainCanvas.width, mainCanvas.height);

    const centerX = mainCanvas.width / 2;
    const centerY = mainCanvas.height / 2;

    const intensityMult = currentIntensityPct / 50;

    if (active) {
      pulseAngle += (currentPhase === 'action' ? 0.05 : 0.02) * intensityMult;

      const radius = 75 + Math.sin(pulseAngle) * (currentPhase === 'action' ? 7 : 2);

      mainCtx.beginPath();
      mainCtx.arc(centerX, centerY, radius, 0, Math.PI * 2);
      mainCtx.strokeStyle = currentPhase === 'action' ? '#00f0ff' : '#ff0055';
      mainCtx.lineWidth = 4;
      mainCtx.shadowBlur = 15;
      mainCtx.shadowColor = currentPhase === 'action' ? '#00f0ff' : '#ff0055';
      mainCtx.stroke();
    } else {
      mainCtx.beginPath();
      mainCtx.arc(centerX, centerY, 75, 0, Math.PI * 2);
      mainCtx.strokeStyle = '#1a1a29';
      mainCtx.lineWidth = 2;
      mainCtx.shadowBlur = 0;
      mainCtx.stroke();
    }

    strokeCtx.clearRect(0, 0, strokeCanvas.width, strokeCanvas.height);

    const w = strokeCanvas.width;
    const h = strokeCanvas.height;
    const midX = w / 2;
    const topY = 30;
    const bottomY = h - 65;
    const totalLen = bottomY - topY;

    const strokeColor = currentPhase === 'action' ? '#00f0ff' : '#ff0055';
    const fillColor = currentPhase === 'action' ? 'rgba(0, 240, 255, 0.08)' : 'rgba(255, 0, 85, 0.08)';

    const shaftHalfWidth = 25;
    const lowerWidth = 40;

    strokeCtx.beginPath();
    strokeCtx.moveTo(midX - 25, topY + 48);
    strokeCtx.lineTo(midX - 32, topY + 42);
    strokeCtx.bezierCurveTo(midX - 32, topY + 12, midX - 18, topY, midX, topY);
    strokeCtx.bezierCurveTo(midX + 18, topY, midX + 32, topY + 12, midX + 32, topY + 42);
    strokeCtx.lineTo(midX + 25, topY + 48);

    strokeCtx.lineTo(midX + shaftHalfWidth, bottomY - 7);

    strokeCtx.bezierCurveTo(midX + lowerWidth, bottomY + 8, midX + lowerWidth, bottomY + 30, midX + 24, bottomY + 40);
    strokeCtx.bezierCurveTo(midX + 16, bottomY + 44, midX + 7, bottomY + 45, midX, bottomY + 43);
    strokeCtx.bezierCurveTo(midX - 7, bottomY + 45, midX - 16, bottomY + 44, midX - 24, bottomY + 40);
    strokeCtx.bezierCurveTo(midX - lowerWidth, bottomY + 30, midX - lowerWidth, bottomY + 8, midX - shaftHalfWidth, bottomY - 7);

    strokeCtx.lineTo(midX - 25, topY + 48);
    strokeCtx.closePath();

    strokeCtx.fillStyle = fillColor;
    strokeCtx.fill();
    strokeCtx.lineWidth = 2;
    strokeCtx.strokeStyle = strokeColor;
    strokeCtx.lineCap = 'round';
    strokeCtx.lineJoin = 'round';
    strokeCtx.stroke();

    strokeCtx.beginPath();
    strokeCtx.moveTo(midX, bottomY + 5);
    strokeCtx.bezierCurveTo(midX - 2, bottomY + 18, midX - 2, bottomY + 34, midX, bottomY + 43);
    strokeCtx.strokeStyle = currentPhase === 'action' ? 'rgba(0,240,255,0.42)' : 'rgba(255,0,85,0.42)';
    strokeCtx.lineWidth = 1.5;
    strokeCtx.stroke();

    const veinColor = currentPhase === 'action' ? 'rgba(0,240,255,0.35)' : 'rgba(255,0,85,0.35)';

    strokeCtx.beginPath();
    strokeCtx.moveTo(midX - 8, bottomY - 12);
    strokeCtx.bezierCurveTo(midX - 18, bottomY - 40, midX - 7, bottomY - 65, midX - 15, bottomY - 100);
    strokeCtx.bezierCurveTo(midX - 21, bottomY - 125, midX - 10, topY + 120, midX - 18, topY + 62);
    strokeCtx.strokeStyle = veinColor;
    strokeCtx.lineWidth = 1.7;
    strokeCtx.stroke();

    strokeCtx.beginPath();
    strokeCtx.moveTo(midX + 9, bottomY - 14);
    strokeCtx.bezierCurveTo(midX + 19, bottomY - 45, midX + 8, bottomY - 75, midX + 16, bottomY - 108);
    strokeCtx.bezierCurveTo(midX + 22, bottomY - 130, midX + 10, topY + 115, midX + 19, topY + 58);
    strokeCtx.strokeStyle = veinColor;
    strokeCtx.lineWidth = 1.7;
    strokeCtx.stroke();

    if (active && currentPhase === 'action') {
      strokePos += strokeSpeed * strokeDirection * intensityMult;

      if (strokePos >= strokeRangeMax) {
        strokePos = strokeRangeMax;
        strokeDirection = -1;
      } else if (strokePos <= strokeRangeMin) {
        strokePos = strokeRangeMin;
        strokeDirection = 1;
      }
    } else if (active && currentPhase === 'pause') {
      strokePos += (0.85 - strokePos) * 0.1;
    } else {
      strokePos = 0.85;
    }

    const currentY = topY + strokePos * totalLen;
    const handColor = currentPhase === 'action' ? 'rgba(0,240,255,0.88)' : 'rgba(255,0,85,0.88)';

    if (handsCount === 2) {
      drawHandGrip(midX, currentY + 12, true, handColor);
      drawHandGrip(midX, currentY - 18, false, handColor);
    } else {
      drawHandGrip(midX, currentY, activeHandSide === 'right', handColor);
    }

    requestAnimationFrame(renderAnimations);
  }

  renderAnimations();


  function playTone(freq = 440, type = 'sine', duration = 0.15) {
    if (audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();

    osc.type = type;
    osc.frequency.value = freq;

    gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);

    osc.connect(gain);
    gain.connect(audioCtx.destination);

    osc.start();
    osc.stop(audioCtx.currentTime + duration);
  }


  function speak(text) {
    if (!synth) return;
    synth.cancel();

    const utterance = new SpeechSynthesisUtterance(text);
    if (trainerVoice) utterance.voice = trainerVoice;
    utterance.rate = 1.0;
    utterance.pitch = 0.8;

    synth.speak(utterance);
  }


  function updateDisplay() {
    const hrs = String(Math.floor(seconds / 3600)).padStart(2, '0');
    const mins = String(Math.floor((seconds % 3600) / 60)).padStart(2, '0');
    const secs = String(seconds % 60).padStart(2, '0');
    document.getElementById('mainTimer').innerText = `${hrs}:${mins}:${secs}`;
  }


  function toggleSession() {
    if (!active) {
      active = true;
      seconds = 0;
      edges = 0;

      document.getElementById('edgeCount').innerText = '0';
      document.getElementById('modeSelect').disabled = true;
      document.getElementById('startBtn').innerText = 'Stop Session';
      document.getElementById('edgeBtn').style.display = 'block';
      document.getElementById('techniqueTag').style.display = 'inline-block';

      timerInterval = setInterval(() => {
        seconds++;
        updateDisplay();
      }, 1000);

      playTone(660, 'sine', 0.2);
      speak("Session started. Keep your intensity locked and follow the cues.");
      startNextPhase('action');
    } else {
      endSession();
    }
  }


  function startNextPhase(forcedPhase = null) {
    clearInterval(phaseInterval);

    if (forcedPhase) {
      currentPhase = forcedPhase;
    } else {
      currentPhase = currentPhase === 'action' ? 'pause' : 'action';
    }

    const mode = document.getElementById('modeSelect').value;
    const intensityMult = currentIntensityPct / 50;

    const box = document.getElementById('statusBox');
    const prompt = document.getElementById('promptText');
    const sub = document.getElementById('subPrompt');
    const tag = document.getElementById('techniqueTag');

    if (currentPhase === 'action') {
      box.classList.remove('pause');
      playTone(520, 'sine', 0.15);

      if (mode === 'warmup') {
        phaseTimeLeft = Math.floor((Math.random() * 15 + 30) / (intensityMult * 0.7));
      } else if (mode === 'endurance') {
        phaseTimeLeft = Math.floor((Math.random() * 30 + 45) / (intensityMult * 0.5));
      } else if (mode === 'ladder') {
        phaseTimeLeft = Math.floor((Math.random() * 15 + 15) / intensityMult);
      } else if (mode === 'extreme') {
        phaseTimeLeft = Math.floor((Math.random() * 20 + 35) / (intensityMult * 0.8));
      } else if (mode === 'chaos') {
        phaseTimeLeft = Math.floor((Math.random() * 25 + 10) / intensityMult);
      } else {
        phaseTimeLeft = Math.floor((Math.random() * 20 + 25) / intensityMult);
      }

      phaseTimeLeft = Math.max(5, phaseTimeLeft);

      const instructions = [
        {
          rhythm: 'Slow steady pace',
          style: 'Full Range Edging',
          vocal: 'Maintain a slow steady rhythm.',
          baseSpeed: 0.02,
          min: 0.0,
          max: 0.85,
          hands: 1,
          side: 'right'
        },
        {
          rhythm: 'Medium rhythm',
          style: 'Controlled Edging',
          vocal: 'Switch direction and maintain the rhythm.',
          baseSpeed: 0.035,
          min: 0.1,
          max: 0.7,
          hands: 1,
          side: 'left'
        },
        {
          rhythm: 'Gradual speed build',
          style: 'Two-Handed Edging',
          vocal: 'Gradually increase the motion speed.',
          baseSpeed: 0.05,
          min: 0.1,
          max: 0.85,
          hands: 2,
          side: 'right'
        },
        {
          rhythm: 'Light pressure',
          style: 'Edge Hold',
          vocal: 'Ease the motion and approach your edge gently.',
          baseSpeed: 0.025,
          min: 0.4,
          max: 0.85,
          hands: 1,
          side: 'right'
        },
        {
          rhythm: 'Controlled cadence',
          style: 'High-Grip Edging',
          vocal: 'Use a short controlled range near the tip.',
          baseSpeed: 0.03,
          min: 0.0,
          max: 0.3,
          hands: 2,
          side: 'right'
        }
      ];

      const chosen = instructions[Math.floor(Math.random() * instructions.length)];

      if (mode === 'extreme') {
        strokeSpeed = chosen.baseSpeed * 1.5;
      } else if (mode === 'warmup') {
        strokeSpeed = chosen.baseSpeed * 0.7;
      } else {
        strokeSpeed = chosen.baseSpeed;
      }

      strokeRangeMin = chosen.min;
      strokeRangeMax = chosen.max;
      handsCount = chosen.hands;
      activeHandSide = chosen.side;

      prompt.innerText = 'STROKE / BUILD';
      sub.innerText = chosen.rhythm;
      tag.innerText = `Focus: ${chosen.style}`;

      speak(chosen.vocal);

    } else {
      box.classList.add('pause');
      playTone(280, 'triangle', 0.3);

      if (mode === 'extreme') {
        phaseTimeLeft = Math.floor(Math.random() * 5) + 4;
      } else if (mode === 'warmup') {
        phaseTimeLeft = Math.floor(Math.random() * 10) + 15;
      } else if (mode === 'chaos') {
        phaseTimeLeft = Math.floor(Math.random() * 10) + 5;
      } else {
        phaseTimeLeft = Math.floor(Math.random() * 15) + 10;
      }

      const pausePhrases = [
        'Halt immediately and hold your edge.',
        'Hands off. Clear your tension.',
        'Freeze motion and steady your breath.'
      ];

      const chosenPause = pausePhrases[Math.floor(Math.random() * pausePhrases.length)];

      prompt.innerText = 'HALT / HOLD';
      sub.innerText = 'Hands off and cool down.';
      tag.innerText = 'Focus: Controlled breathing';

      speak(chosenPause);
    }

    totalPhaseDuration = phaseTimeLeft;
    updateProgressBar();

    document.getElementById('phaseTimer').innerText = `${phaseTimeLeft}s`;

    phaseInterval = setInterval(() => {
      phaseTimeLeft--;
      document.getElementById('phaseTimer').innerText = `${phaseTimeLeft}s`;
      updateProgressBar();

      if (phaseTimeLeft <= 0) {
        startNextPhase();
      }
    }, 1000);
  }


  function updateProgressBar() {
    const percentage = ((totalPhaseDuration - phaseTimeLeft) / totalPhaseDuration) * 100;
    document.getElementById('phaseProgressBar').style.width = `${Math.min(100, Math.max(0, percentage))}%`;
  }


  function logEdge() {
    if (!active) return;

    edges++;
    document.getElementById('edgeCount').innerText = edges;

    playTone(200, 'sawtooth', 0.4);
    speak('Edge recorded! Stop all motion and hold the reset.');

    startNextPhase('pause');
  }


  function endSession() {
    active = false;

    clearInterval(timerInterval);
    clearInterval(phaseInterval);

    document.getElementById('modeSelect').disabled = false;
    document.getElementById('startBtn').innerText = 'Start Session';
    document.getElementById('edgeBtn').style.display = 'none';
    document.getElementById('techniqueTag').style.display = 'none';

    document.getElementById('promptText').innerText = 'COMPLETE';
    document.getElementById('subPrompt').innerText = 'Training session finished';
    document.getElementById('statusBox').classList.remove('pause');
    document.getElementById('phaseTimer').innerText = '--';
    document.getElementById('phaseProgressBar').style.width = '0%';

    playTone(440, 'sine', 0.3);
    speak(`Session finished. Total training time: ${Math.floor(seconds / 60)} minutes with ${edges} total edges achieved.`);
  }

  updateIntensityUI();

</script>

</body>
</html>
